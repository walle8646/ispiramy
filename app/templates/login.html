{% extends "base.html" %}

{% block title %}Login - Ispiramy{% endblock %}

{% block content %}
<div class="pannello-accesso" style="max-width: 500px; margin: 80px auto; padding: 48px; background: white; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);">
    <h1 style="text-align: center; margin-bottom: 32px; color: #1a1a1a;">🔐 Accedi a Ispiramy</h1>
    
    <form id="loginForm">
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #1a1a1a;">Email</label>
            <input 
                type="email" 
                name="email" 
                required 
                placeholder="tua@email.com"
                style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.3s;"
                onfocus="this.style.borderColor='#43a047'"
                onblur="this.style.borderColor='#e0e0e0'"
            >
        </div>

        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #1a1a1a;">Password</label>
            <input 
                type="password" 
                name="password" 
                required 
                placeholder="••••••••"
                style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.3s;"
                onfocus="this.style.borderColor='#43a047'"
                onblur="this.style.borderColor='#e0e0e0'"
            >
        </div>

        <div style="text-align: right; margin-bottom: 24px;">
            <a href="/reset-password" style="color: #43a047; font-weight: 600; text-decoration: none; font-size: 14px;">Password dimenticata?</a>
        </div>

        <div id="loginError" style="display: none; background: #fee; border-left: 4px solid #e74c3c; padding: 16px; border-radius: 8px; margin-bottom: 16px;">
            <strong style="color: #e74c3c;"></strong>
        </div>

        <button 
            type="submit" 
            class="hero-btn" 
            style="width: 100%; padding: 16px; border: none; cursor: pointer; font-size: 18px; font-weight: 600; margin-top: 8px;"
        >
            Accedi
        </button>
    </form>

    <!-- Separatore -->
    <div style="display: flex; align-items: center; margin: 24px 0;">
        <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
        <span style="padding: 0 16px; color: #999; font-size: 14px;">oppure</span>
        <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
    </div>

    <!-- Google Login Button -->
    <a href="/auth/google" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; text-decoration: none; color: #1a1a1a; font-size: 16px; font-weight: 600; transition: border-color 0.3s, box-shadow 0.3s;" onmouseover="this.style.borderColor='#4285f4'; this.style.boxShadow='0 2px 8px rgba(66,133,244,0.2)'" onmouseout="this.style.borderColor='#e0e0e0'; this.style.boxShadow='none'">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Accedi con Google
    </a>

    <p style="text-align: center; margin-top: 24px; color: #666;">
        Non hai un account? <a href="/register" style="color: #43a047; font-weight: 600; text-decoration: none;">Registrati Gratis</a>
    </p>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const errorDiv = document.getElementById('loginError');
    const errorText = errorDiv.querySelector('strong');
    
    // Nascondi errore precedente
    errorDiv.style.display = 'none';
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json().catch(() => ({}));
        
        if (response.ok) {
            // Login riuscito: redirect
            window.location.href = data.redirect_url || '/profile';
        } else {
            // Login fallito: mostra errore
            errorText.textContent = '❌ ' + (data.error || `Il server ha risposto con un errore (${response.status}). Riprova.`);
            errorDiv.style.display = 'block';
        }
    } catch (error) {
        console.error('Error:', error);
        errorText.textContent = '❌ Errore di connessione. Riprova.';
        errorDiv.style.display = 'block';
    }
});
</script>
{% endblock %}
